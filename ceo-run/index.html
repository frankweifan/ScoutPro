const rint=(a,b)=>Math.floor(rnd(a,b+1));

const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif';
function font(g,size,w){g.font=(w||800)+' '+Math.round(size*10)/10+'px '+FONT;}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function box(g,x,y,w,h,r,fill,stroke,lw){g.beginPath();rr(g,x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}}
function txt(g,s,x,y,size,fill,align,stroke,lw,w){font(g,size,w);g.textAlign=align||'left';g.textBaseline='middle';if(stroke){g.lineJoin='round';g.strokeStyle=stroke;g.lineWidth=lw||size*0.22;g.strokeText(s,x,y);}g.fillStyle=fill;g.fillText(s,x,y);}

function wrap(g,text,maxW){ // 逐字换行（中文友好）
  const out=[];
  for(const para of String(text).split('\n')){
    let line='';
    for(const ch of para){
      if(g.measureText(line+ch).width>maxW && line && NOHEAD.indexOf(ch)<0){out.push(line);line=ch;}
      else line+=ch;
    }
    out.push(line);
  }
  return out;
}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function shade(hex,k){ // k<0 变暗 k>0 变亮
  const n=parseInt(hex.slice(1),16);let r=n>>16&255,gg=n>>8&255,b=n&255;
  if(k<0){r*=1+k;gg*=1+k;b*=1+k;}else{r+=(255-r)*k;gg+=(255-gg)*k;b+=(255-b)*k;}
  return 'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';

function auInit(){

  try{
    AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AU.mg=AU.ctx.createGain();AU.mg.gain.value=AU.on?0.55:0;AU.mg.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate*0.5,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);

function tone(f,d,type,vol,f2,delay,at){
  if(!AU.ctx||!AU.on)return;const c=AU.ctx,t0=(at||c.currentTime)+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||0.1,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(AU.mg);o.start(t0);o.stop(t0+d+0.02);
}
function noise(d,vol,freq,delay,at,type){
  if(!AU.ctx||!AU.on)return;const c=AU.ctx,t0=(at||c.currentTime)+(delay||0);
  const s=c.createBufferSource();s.buffer=AU.nbuf;const f=c.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq||1000;
  const g=c.createGain();g.gain.setValueAtTime(vol||0.2,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(AU.mg);s.start(t0);s.stop(t0+d+0.02);
}

function music(name){if(AU.song===name)return;AU.song=name;AU.step=0;if(AU.ctx)AU.next=AU.ctx.currentTime+0.05;}
function auTick(){
  if(!AU.ctx||!AU.song)return;const sg=SONGS[AU.song];if(!sg)return;
  const c=AU.ctx,sl=60/sg.bpm/2;
  if(AU.next<c.currentTime-0.3)AU.next=c.currentTime+0.02;
  while(AU.next<c.currentTime+0.12){
    const i=AU.step,t=AU.next;
    if(AU.on){
      const b=sg.bass[i%sg.bass.length],l=sg.lead[i%sg.lead.length],d=sg.drum[i%sg.drum.length];
      if(b!==_)tone(sg.root/2*Math.pow(2,b/12),sl*0.9,'triangle',0.11,0,0,t);
      if(l!==_)tone(sg.root*Math.pow(2,l/12),sl*1.4,sg.wave,sg.wave==='triangle'?0.075:0.038,0,0,t);

// ================= 美术：矢量卡通角色 =================
const OUT='#2a1b30';
function shp(g,fill,fn,lw){g.beginPath();fn(g);if(fill){g.fillStyle=fill;g.fill();}if(lw!==0){g.strokeStyle=OUT;g.lineWidth=lw||3;g.lineJoin='round';g.stroke();}}
function limb(g,p,w,col,col2){
  g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(p[2],p[3]);g.lineTo(p[4],p[5]);
  g.strokeStyle=OUT;g.lineWidth=w+5;g.stroke();
  g.strokeStyle=col;g.lineWidth=w;g.stroke();
  if(col2){g.beginPath();g.moveTo((p[2]+p[4])/2,(p[3]+p[5])/2);g.lineTo(p[4],p[5]);g.strokeStyle=col2;g.lineWidth=w;g.stroke();}
}
function ik2(ax,ay,bx,by,l1,l2,s,bf){ // 两段骨骼，关节朝外(s)弯
  let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||0.001;const mx=l1+l2-0.5;
  if(d>mx){bx=ax+dx/d*mx;by=ay+dy/d*mx;dx=bx-ax;dy=by-ay;d=mx;}
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a))*(bf||1);
  const px=ax+dx/d*a,py=ay+dy/d*a;
  let jx=px-dy/d*h,jy=py+dx/d*h;const kx=px+dy/d*h,ky=py-dx/d*h;
  if(kx*s>jx*s||(Math.abs(kx-jx)<0.5&&ky>jy)){jx=kx;jy=ky;}
  return [jx,jy,bx,by];
}
function poseOf(pose,t){
  const P={bob:0,tilt:0,hl:[-36,-54],hr:[36,-54],fl:[-12,0],fr:[12,0],front:false};
  const s=Math.sin,ph=t*TAU;
  switch(pose){
    case 'stand':P.bob=s(ph)*1.5;break;
    case 'talk':P.bob=s(ph)*1.5;P.hr=[38,-74+s(ph*2)*5];P.hl=[-36,-56];break;
    case 'run':{const a=s(ph),b=s(ph+PI);P.bob=-Math.abs(s(ph))*6;P.fl=[-12,-Math.max(0,a)*26];P.fr=[12,-Math.max(0,b)*26];
      P.hl=[-40,-74-b*18];P.hr=[40,-74-a*18];P.tilt=s(ph)*0.05;break;}
    case 'jump':P.fl=[-17,-18];P.fr=[17,-12];P.hl=[-48,-130];P.hr=[48,-134];break;
    case 'cheer':P.hl=[-46,-128+s(ph*2)*7];P.hr=[46,-128-s(ph*2)*7];P.bob=-Math.abs(s(ph))*5;break;
    case 'rage':P.hl=[-40,-62];P.hr=[42,-134+s(ph*2)*9];P.bob=s(ph*2)*2;P.tilt=s(ph)*0.05;break;
    case 'film':P.hl=[-30,-92];P.hr=[38,-132+s(ph)*3];P.bob=s(ph)*2;P.tilt=s(ph)*0.04;break;
    case 'aim':P.hl=[-17,-108];P.hr=[17,-108];P.bob=s(ph)*2;P.front=true;break;
    case 'point':P.hr=[24,-90+s(ph)*3];P.hl=[-34,-70];P.bob=s(ph)*2;P.front=true;break;
    case 'stop':P.hr=[26,-96+s(ph)*2];P.hl=[-38,-60];P.bob=s(ph)*1.5;P.front=true;break;
    case 'guard':P.hl=[-24,-102+s(ph*2)*4];P.hr=[24,-102-s(ph*2)*4];P.bob=s(ph*2)*3;P.front=true;break;
    case 'punch':P.hl=[-24,-104];P.hr=[8,-96];P.front=true;P.big=1;break;
    case 'attack':P.hl=[-44,-70];P.hr=[30,-150];P.bob=-4;P.tilt=-0.08;break;
    case 'hurt':P.hl=[-52,-124];P.hr=[52,-112];P.tilt=0.22;P.fl=[-18,-6];P.bob=-3;break;
    case 'beg':P.hl=[-12,-84];P.hr=[12,-84];P.bob=s(ph*2)*2;P.front=true;break;
  }
  return P;
}

}

      g.strokeStyle='rgba(0,0,0,.14)';g.lineWidth=2.5;for(const x of[-22,-8,8,22]){g.beginPath();g.moveTo(x*0.6,-26);g.quadraticCurveTo(x*1.2,-44,x*0.8,-56);g.stroke();}break;

function drawEye(g,x,y,st,sp,side){

  for(const s of[-1,1]){g.fillStyle=th.wall;g.beginPath();g.moveTo(V.cx,V.hy);g.lineTo(V.cx+s*xo,yb);g.lineTo(V.cx+s*xo,yt);g.fill();
    if(th.wains){const ym=yb-th.wains*pF*V.px;g.fillStyle=th.wall2;g.beginPath();g.moveTo(V.cx,V.hy);g.lineTo(V.cx+s*xo,yb);g.lineTo(V.cx+s*xo,ym);g.fill();}}
  g.fillStyle=th.ceil;g.beginPath();g.moveTo(V.cx,V.hy);g.lineTo(V.cx-xo,yt);g.lineTo(V.cx+xo,yt);g.fill();
  g.strokeStyle=th.wallLine;g.lineWidth=1.5;const off=Wd.dist%4;
  for(let z=-off;z<70;z+=4){if(z<V.zmin)continue;const a=pj(-wx,0,z),b=pj(-wx,wh,z),c=pj(wx,wh,z),d=pj(wx,0,z);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.stroke();}
  const a=pj(-wx,0,110),c=pj(wx,wh,110);g.fillStyle=th.endc;g.fillRect(a[0],c[1],c[0]-a[0],a[1]-c[1]);
}
function drawQuadItem(g,s,th){
  const z0=Math.max(s.z,V.zmin+0.3),z1=s.z+s.len;if(z1<=z0+0.05)return;
  const p=CAMD/(z0+CAMD);if(CAMD/(z1+CAMD)<0.075)return;
  if(s.cq){quad(g,pj(s.x0,th.wh,z0),pj(s.x1,th.wh,z0),pj(s.x1,th.wh,z1),pj(s.x0,th.wh,z1));g.fillStyle=s.c;g.fill();g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=1;g.stroke();return;}
  const x=s.side*th.wx,Q=(a,b,c,d)=>quad(g,pj(x,c,a),pj(x,c,b),pj(x,d,b),pj(x,d,a));
  const L=z1-z0,full=s.len;
  if(s.kind==='door'){Q(z0,z1,s.y0,s.y1);g.fillStyle='#4a2a18';g.fill();
    Q(z0+Math.min(L,0.12),Math.max(z0,z1-0.12),s.y0,s.y1-0.12);g.fillStyle='#7a4526';g.fill();
    if(z1-0.3>z0){const k=pj(x,1.15,z1-0.3);g.fillStyle='#ffd54f';g.beginPath();g.arc(k[0],k[1],Math.max(1.5,k[2]*V.px*0.06),0,TAU);g.fill();}
    if(L>full*0.6){Q(z0+full*0.3,z0+full*0.7,s.y1+0.12,s.y1+0.42);g.fillStyle='#ffd54f';g.fill();}}
  else if(s.kind==='painting'){Q(z0,z1,s.y0,s.y1);g.fillStyle='#ffb300';g.fill();
    if(L>0.3){Q(z0+0.12,z1-0.12,s.y0+0.12,s.y1-0.12);g.fillStyle=['#4fc3f7','#81c784','#f48fb1','#ce93d8'][s.v%4];g.fill();}}
  else if(s.kind==='screen'){Q(z0,z1,s.y0,s.y1);g.fillStyle='#0b1622';g.fill();g.strokeStyle='#78909c';g.lineWidth=Math.max(1,p*3);g.stroke();
    g.strokeStyle='#39d353';g.lineWidth=Math.max(1,p*V.px*0.05);g.lineJoin='round';g.beginPath();let st=false;
    for(let i=0;i<=10;i++){const zz=s.z+0.4+(full-0.8)*i/10;if(zz<z0)continue;const yy=s.y1-0.35-(s.y1-s.y0-0.7)*(i/10)+(hsh(s.v*13+i)-0.5)*0.5*(i<10?1:0);const q=pj(x,clamp(yy,s.y0+0.2,s.y1-0.2),zz);if(!st){g.moveTo(q[0],q[1]);st=true;}else g.lineTo(q[0],q[1]);}
    g.stroke();}
}
function drawBox(g,b){
  const z0=Math.max(b.z,V.zmin+0.3),z1=b.z+b.len;if(z1<=z0)return;
  const p0=CAMD/(z0+CAMD),al=clamp((p0-0.072)/0.05,0,1);if(al<=0)return;
  const side=b.x0>0?1:-1,xn=side>0?Math.min(b.x0,b.x1):Math.max(b.x0,b.x1),xf=side>0?Math.max(b.x0,b.x1):Math.min(b.x0,b.x1);
  g.globalAlpha=al;
  quad(g,pj(xn,0,z0),pj(xn,0,z1),pj(xn,b.h,z1),pj(xn,b.h,z0));g.fillStyle=b.c2;g.fill();
  const nf=Math.max(2,Math.round(b.h/1.5)),nz=Math.max(2,Math.round(b.len/2.4));
  if(p0>0.1){
    for(let i=0;i<nz;i++){const za=b.z+b.len*(i+0.2)/nz,zb=b.z+b.len*(i+0.8)/nz;if(zb<=z0)continue;const zc=Math.max(za,z0);
      if(b.col){quad(g,pj(xn,0.3,zc),pj(xn,0.3,zb),pj(xn,b.h-0.8,zb),pj(xn,b.h-0.8,zc));g.fillStyle='rgba(120,140,160,.35)';g.fill();continue;}
      for(let j=0;j<nf;j++){if(hsh(b.seed*7+i*3+j*11)<0.45)continue;const ya=b.h*(j+0.25)/nf,yb=b.h*(j+0.75)/nf;quad(g,pj(xn,ya,zc),pj(xn,ya,zb),pj(xn,yb,zb),pj(xn,yb,zc));g.fillStyle=b.win;g.fill();}}
  }
  if(b.z>V.zmin+0.3){const a=pj(xn,0,z0),c=pj(xf,b.h,z0);const x=Math.min(a[0],c[0]),w=Math.abs(c[0]-a[0]),h=a[1]-c[1];
    if(x<W&&x+w>0){g.fillStyle=b.c;g.fillRect(x,c[1],w,h);
      if(b.col){g.fillStyle='rgba(120,140,160,.4)';const n=7;for(let i=0;i<n;i++)g.fillRect(x+w*(i+0.3)/n,c[1]+h*0.15,w*0.4/n,h*0.8);}
      else{const n=5;for(let i=0;i<n;i++)for(let j=0;j<nf;j++){if(hsh(b.seed*5+i*17+j*3)<0.5)continue;g.fillStyle=b.win;g.fillRect(x+w*(i+0.25)/n,c[1]+h*(j+0.25)/nf,w*0.5/n,h*0.5/nf);}}}}
  g.globalAlpha=1;
}
function drawScenItem(g,it){
  const q=pj(it.x,it.y||0,it.z);if(q[2]<0.072)return;
  const c=prop(it.k),k=q[2]*V.px/100*(it.s||1);
  if(q[0]+c.lw*k/2<0||q[0]-c.lw*k/2>W)return;
  const al=clamp((q[2]-0.072)/0.04,0,1);if(al<1)g.globalAlpha=al;
  blit(c,q[0],q[1],k);g.globalAlpha=1;
}
function drawWorld(t,extras,bossFn){
  const g=ctx,th=Wd.th;
  const sk=g.createLinearGradient(0,0,0,V.hy);sk.addColorStop(0,th.sky[0]);sk.addColorStop(1,th.sky[1]);g.fillStyle=sk;g.fillRect(0,0,W,V.hy+1);
  if(th.back)th.back(g,t);
  drawGround(g,th);
  if(th.indoor){drawWalls(g,th);const r=(V.gy-V.hy)*0.5,fg=g.createRadialGradient(V.cx,V.hy,0,V.cx,V.hy,r);fg.addColorStop(0,th.fog);fg.addColorStop(0.25,hexA(th.fog,0.8));fg.addColorStop(1,hexA(th.fog,0));g.fillStyle=fg;g.fillRect(V.cx-r,V.hy-r,r*2,r*2);}
  else{const d=(V.gy-V.hy)*0.2,fg=g.createLinearGradient(0,V.hy,0,V.hy+d);fg.addColorStop(0,th.fog);fg.addColorStop(1,hexA(th.fog,0));g.fillStyle=fg;g.fillRect(0,V.hy-1,W,d+1);}
  const list=[];
  for(const s of Wd.scen){if(s.wq||s.cq)drawQuadItem(g,s,th);else list.push(s);}
  if(extras)for(const e of extras)list.push(e);
  list.sort((a,b)=>(b.zs!==undefined?b.zs:b.z)-(a.zs!==undefined?a.zs:a.z));
  if(bossFn)bossFn(g);
  for(const it of list){if(it.draw)it.draw(g);else if(it.box)drawBox(g,it);else drawScenItem(g,it);}
}

    const ch=[['wife',-1.55,0.74,'rage','angry'],['pres',1.55,0.74,'rage','yell'],['husband',-0.98,0.84,'guard','mad'],['pap',0.98,0.84,'aim','normal'],['anchor',-0.42,0.7,'point','happy'],['tycoon',0.45,0.7,'rage','angry']];
    ch.sort((a,b)=>a[2]-b[2]);
    for(const c of ch){g.save();g.translate(V.cx+c[1]*kc*105,gy-(1-c[2])*kc*150);g.scale(kc*c[2],kc*c[2]);drawChar(g,CH[c[0]],{pose:c[3],expr:c[4],t:t*0.9+c[1],flash:c[0]==='pap'&&Math.floor(t*1.5)%3===0});g.restore();}
    g.fillStyle='rgba(60,10,90,.25)';g.fillRect(0,gy-kc*230,W,kc*235);
    g.save();g.translate(V.cx,gy+kc*18);g.scale(kc*1.22,kc*1.22);drawChar(g,CH.jia,{pose:'run',expr:'panic',t:t*1.7});g.restore();
    // 标题
    const ly=H*(port?0.15:0.17),ls=Math.min(W/5.6,H*0.13,92*S);
    g.save();g.translate(V.cx,ly);g.rotate(-0.05+Math.sin(t*1.5)*0.012);
    txt(g,'总裁快跑',0,ls*0.08,ls,'#2a1b30','center','#2a1b30',ls*0.3,900);
    txt(g,'总裁快跑',0,0,ls,'#ffeb3b','center','#2a1b30',ls*0.2,900);
    g.fillStyle='#ff4081';g.strokeStyle=OUT;g.lineWidth=3;g.beginPath();rr(g,-ls*1.55,ls*0.62,ls*3.1,ls*0.5,ls*0.12);g.fill();g.stroke();
    txt(g,'热 搜 求 生 记',0,ls*0.885,ls*0.32,'#fff','center',null,0,900);g.restore();
    txt(g,'一失足成千古瓜 · 讽刺动作跑酷',V.cx,ly+ls*1.42,Math.min(12.5*S,W/26),'rgba(255,255,255,.85)','center','rgba(0,0,0,.4)',3,700);
    // 按钮
    const bw=Math.min(250*S,W-70*S),bh=56*S,by=H*(port?0.735:0.8);
    const pu=1+Math.sin(t*4)*0.025;g.save();g.translate(V.cx,by+bh/2);g.scale(pu,pu);g.translate(-V.cx,-(by+bh/2));
    uiBtn(SAVE.unlock>0?'继续逃跑 · 第'+'一二三四五六'[SAVE.unlock]+'章':'开始逃跑',V.cx,by,bw,bh,()=>this.begin());g.restore();
    if(SAVE.unlock>0){const n=LEVELS.length,cs=34*S,gap=8*S,x0=V.cx-(n*cs+(n-1)*gap)/2,cy=by+bh+16*S;
      for(let i=0;i<n;i++){const ok=i<=SAVE.unlock,x=x0+i*(cs+gap);box(g,x,cy,cs,cs,cs/2,ok?'#fff':'rgba(255,255,255,.25)',OUT,2.5);txt(g,String(i+1),x+cs/2,cy+cs/2+1,15*S,ok?OUT:'rgba(0,0,0,.4)','center',null,0,900);if(ok)button(x,cy,cs,cs,()=>{if(i===0)newGame();else startAt(i);});}
      txt(g,'选择章节',V.cx,cy+cs+13*S,11*S,'rgba(255,255,255,.8)','center');}
    else txt(g,'滑动屏幕 / 方向键：← → 换道　↑ 跳跃　↓ 滑铲',V.cx,by+bh+24*S,Math.min(12*S,W/30),'rgba(255,255,255,.9)','center','rgba(0,0,0,.35)',3);
    txt(g,'本故事纯属虚构，如有雷同——那你可要小心了。',V.cx,H-16*S,Math.min(11*S,W/30),'rgba(255,255,255,.75)','center');
    muteBtn();
  }
};
function startAt(i){G.price=100+i*12;G.stats={hits:0,coins:0};startChapter(i);}
// ================= 主循环 =================
let lastTs=0;const TS=clamp(parseInt(QS.get('ts')||'1')||1,1,20);
function frame(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;G.t+=dt;
  while(acts.length){const a=acts.shift();
    if(a.a==='mute'){setMute(AU.on);continue;}
    if(a.a==='tap'){let hit=false;for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(a.x>=b.x&&a.x<=b.x+b.w&&a.y>=b.y&&a.y<=b.y+b.h){hit=true;SFX.click();b.fn();break;}}if(hit)continue;}
    if(G.scene.act)G.scene.act(a);}
  for(let i=0;i<TS;i++)if(G.scene.update)G.scene.update(dt);
  btns=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  G.scene.draw();
  if(G.toast){G.toast.t-=dt;const w=ctxW(G.toast.text,14*S)+36*S;ctx.globalAlpha=clamp(G.toast.t*2,0,1);box(ctx,V.cx-w/2,H*0.86,w,38*S,19*S,'rgba(0,0,0,.82)','#fff',1.5);txt(ctx,G.toast.text,V.cx,H*0.86+19*S,14*S,'#fff','center');ctx.globalAlpha=1;if(G.toast.t<=0)G.toast=null;}
  requestAnimationFrame(frame);
}
layout();
(function boot(){
  const c=QS.get('ch');
  if(c!==null){const i=clamp(parseInt(c)||0,0,LEVELS.length-1);G.price=100;G.ch=i;G.si=parseInt(QS.get('seg')||'0')||0;Wd.name='';worldInit(LEVELS[i].theme);runSeq();}
  else{worldInit('stadium');setScene(Title);music('title');}
  requestAnimationFrame(frame);
})();
window.__G=G;
</script>
